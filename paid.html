<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment received - GBL Capital</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="assets/icon.png">
</head>
<body>
  <main class="sheet" style="min-height:100vh;display:grid;place-items:center">
    <div class="wrap narrow center">
      <img src="assets/gbl-logo.png" alt="GBL" style="height:34px;filter:invert(1)">
      <h1 style="margin-top:28px">Thanks, that went through.</h1>
      <p class="lead" style="color:#626879">Go back to the GBL app. Your access updates on its own, usually within a minute. If it hasn't after five, open Profile, then Billing, and tap "I've paid, check again".</p>
      <p class="small">Something wrong with the payment? Ask in the app under Profile, then Help.</p>
    </div>
  </main>
</body>
